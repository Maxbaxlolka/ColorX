<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ColorX Slot V2</title>
<style>
:root{--bg:#06070b;--panel:#10131c;--panel2:#171b27;--line:#2b3143;--text:#f5f7ff;--muted:#8d95aa;--accent:#bfff2f;--accent2:#6ee7ff;--danger:#ff4d6d;--gold:#ffd75a;--shadow:0 18px 60px rgba(0,0,0,.55)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,Arial,sans-serif;color:var(--text);background:radial-gradient(circle at 50% 0%,#20283d 0,#0c0f18 34%,#06070b 75%);overflow-x:hidden}
body:before{content:"";position:fixed;inset:0;pointer-events:none;background:linear-gradient(115deg,transparent 0 30%,rgba(255,255,255,.025) 40%,transparent 52%),radial-gradient(circle at 15% 25%,rgba(110,231,255,.07),transparent 28%),radial-gradient(circle at 85% 35%,rgba(191,255,47,.06),transparent 24%)}
button,input{font:inherit}button{border:0;color:inherit;cursor:pointer}.app{width:min(1180px,100%);margin:auto;padding:18px 18px 28px}.topbar{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:14px}.brand{display:flex;align-items:center;gap:12px}.logo{font-size:clamp(24px,4vw,40px);font-weight:1000;letter-spacing:-2px}.logo span{color:var(--accent);text-shadow:0 0 20px rgba(191,255,47,.35)}.modePill{padding:7px 10px;border:1px solid var(--line);background:#0d1119;border-radius:999px;font-size:12px;font-weight:800;color:var(--muted)}.modePill.demo{color:var(--accent2)}.balanceCard{min-width:210px;padding:11px 14px;border-radius:15px;border:1px solid var(--line);background:linear-gradient(180deg,#151a25,#0e1119);box-shadow:var(--shadow)}.balanceCard small{display:block;color:var(--muted);font-size:10px;letter-spacing:1.6px;font-weight:900}.balanceValue{font-size:22px;font-weight:900;font-variant-numeric:tabular-nums;margin-top:2px}.stage{position:relative;border:1px solid #30374a;background:linear-gradient(180deg,#111621,#090c13);border-radius:28px;padding:18px;box-shadow:0 0 0 1px rgba(255,255,255,.02) inset,var(--shadow);overflow:hidden}.stage:before{content:"";position:absolute;inset:-1px;border-radius:28px;padding:1px;background:linear-gradient(110deg,rgba(110,231,255,.7),transparent 26%,transparent 65%,rgba(191,255,47,.7));-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}.hud{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px}.winBox,.fsBox{border:1px solid var(--line);background:#0b0f17;border-radius:12px;padding:9px 12px}.winBox small,.fsBox small{color:var(--muted);font-size:10px;font-weight:900;letter-spacing:1.3px}.winValue{font-size:20px;font-weight:1000;color:var(--gold);min-width:110px}.fsBox{font-weight:900;color:var(--accent2);text-align:right}.slotShell{position:relative;padding:12px;border-radius:22px;background:linear-gradient(145deg,#2e3547,#111520 60%,#262c3b);border:1px solid #3a4359;box-shadow:inset 0 0 35px rgba(0,0,0,.75),0 20px 45px rgba(0,0,0,.35)}#slot{aspect-ratio:6/3;width:100%;display:grid;grid-template-columns:repeat(6,1fr);grid-template-rows:repeat(3,1fr);gap:8px;background:#05070b;border-radius:15px;padding:8px;overflow:hidden}.cell{position:relative;min-width:0;min-height:0;border-radius:10px;background:radial-gradient(circle at 50% 35%,#222a38,#0b0e14 72%);border:1px solid #22293a;overflow:hidden;display:grid;place-items:center}.cell:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.05),transparent 35%);pointer-events:none}.cell img{width:100%;height:100%;object-fit:contain;position:relative;z-index:1}.cell img.fs{transform:scale(.9)}.cell.landing{animation:land .28s ease}.cell.win{animation:winpulse .8s ease infinite;border-color:rgba(255,215,90,.8);box-shadow:0 0 22px rgba(255,215,90,.25) inset}.cell.dim{opacity:.42;filter:saturate(.45)}.overlay{position:absolute!important;inset:0;width:100%!important;height:100%!important;object-fit:contain!important;pointer-events:none;z-index:3!important}.controls{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:14px;margin-top:16px}.betControl{justify-self:start;display:flex;align-items:center;background:#0b0e15;border:1px solid var(--line);padding:6px;border-radius:16px}.miniBtn{width:42px;height:42px;border-radius:11px;background:#171c27;font-size:22px;font-weight:900}.betCenter{padding:0 16px;text-align:center;min-width:115px}.betCenter small{display:block;color:var(--muted);font-size:10px;font-weight:900;letter-spacing:1.4px}.betCenter strong{font-size:18px}.spinWrap{display:flex;gap:10px;align-items:center;justify-self:center}.spinBtn{width:108px;height:108px;border-radius:50%;background:radial-gradient(circle at 36% 26%,#d9ff7b,var(--accent) 40%,#74a900 76%);color:#111;font-size:21px;font-weight:1000;letter-spacing:.5px;border:7px solid #202637;box-shadow:0 0 0 2px rgba(191,255,47,.45),0 0 36px rgba(191,255,47,.24),inset 0 -10px 20px rgba(0,0,0,.22);transition:.15s}.spinBtn:hover{transform:scale(1.035)}.spinBtn:active{transform:scale(.96)}.spinBtn.spinning{animation:spinGlow .7s ease infinite}.sideActions{justify-self:end;display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}.actionBtn{padding:12px 14px;border-radius:13px;background:#151a25;border:1px solid var(--line);font-size:12px;font-weight:900}.actionBtn.active{color:#111;background:var(--accent)}.actionBtn.x2{color:#161616;background:linear-gradient(135deg,var(--gold),#ff9f43)}.actionBtn:disabled{opacity:.3;cursor:not-allowed}.lower{display:flex;justify-content:center;gap:8px;margin-top:12px}.iconBtn{width:42px;height:42px;border-radius:12px;background:#0d1119;border:1px solid var(--line);font-size:18px}.statusLine{text-align:center;color:var(--muted);font-size:12px;margin-top:12px;min-height:16px}.modal{display:none;position:fixed;inset:0;z-index:1000;background:rgba(2,3,6,.82);backdrop-filter:blur(12px);align-items:center;justify-content:center;padding:18px}.modal.open{display:flex}.modalCard{width:min(500px,100%);border-radius:24px;padding:22px;background:linear-gradient(180deg,#171c29,#0d1018);border:1px solid #333b50;box-shadow:0 30px 90px rgba(0,0,0,.65)}.modalTitle{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.modalTitle h2{margin:0;font-size:24px}.close{background:#252b3a;width:38px;height:38px;border-radius:11px}.settingRow{display:grid;grid-template-columns:120px 1fr;gap:14px;align-items:center;margin:14px 0;color:#cbd2e5}.settingRow input{width:100%;accent-color:var(--accent)}.settingActions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}.settingActions button{padding:13px;border-radius:12px;background:#202637;font-weight:900}.x2Card{text-align:center;max-width:610px}.x2Amount{font-size:clamp(36px,8vw,66px);font-weight:1000;color:var(--gold);margin:8px 0 22px}.pickRow{display:grid;grid-template-columns:1fr 1fr;gap:14px}.pick{height:145px;border-radius:22px;background:linear-gradient(145deg,#202637,#10141e);border:1px solid #3d465e;font-size:54px;font-weight:1000;transition:.16s}.pick:hover{transform:translateY(-3px);border-color:var(--accent2);box-shadow:0 12px 30px rgba(110,231,255,.12)}.take{width:100%;margin-top:14px;padding:15px;border-radius:14px;background:var(--accent);color:#111;font-weight:1000}.celebration{display:none;position:fixed;inset:0;z-index:1200;background:rgba(2,3,6,.78);align-items:center;justify-content:center;text-align:center;padding:20px}.celebration.show{display:flex}.celebrationInner{animation:pop .45s cubic-bezier(.2,.9,.2,1.3)}.celebrationTitle{font-size:clamp(42px,10vw,100px);font-weight:1000;line-height:.9;background:linear-gradient(180deg,#fff,var(--gold));-webkit-background-clip:text;color:transparent;text-shadow:0 18px 60px rgba(255,215,90,.16)}.celebrationSub{margin-top:14px;color:#d7def0;font-size:18px;font-weight:800}.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);opacity:0;z-index:2000;padding:12px 16px;border-radius:12px;background:#161b27;border:1px solid #323a4d;box-shadow:var(--shadow);transition:.25s;pointer-events:none;font-weight:800}.toast.show{opacity:1;transform:translate(-50%,0)}
@keyframes land{0%{transform:translateY(-16px);opacity:.35;filter:blur(2px)}100%{transform:none;opacity:1;filter:none}}@keyframes winpulse{50%{transform:scale(.96);box-shadow:0 0 38px rgba(255,215,90,.35) inset}}@keyframes spinGlow{50%{box-shadow:0 0 0 2px rgba(191,255,47,.75),0 0 58px rgba(191,255,47,.42),inset 0 -10px 20px rgba(0,0,0,.22)}}@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
@media(max-width:760px){.app{padding:10px}.topbar{align-items:stretch}.balanceCard{min-width:0;flex:1}.brand{flex:1}.logo{font-size:27px}.stage{padding:10px;border-radius:20px}.slotShell{padding:7px;border-radius:16px}#slot{gap:4px;padding:4px;border-radius:11px}.cell{border-radius:7px}.controls{grid-template-columns:1fr 1fr;gap:10px}.spinWrap{grid-column:1/-1;grid-row:1}.betControl{grid-column:1;grid-row:2}.sideActions{grid-column:2;grid-row:2}.spinBtn{width:92px;height:92px}.actionBtn{padding:10px 11px}.hud{margin-bottom:8px}.winValue{font-size:17px}.fsBox,.winBox{padding:7px 9px}}@media(max-width:430px){.modePill{display:none}.balanceValue{font-size:17px}.logo{font-size:23px}.controls{display:flex;flex-direction:column}.betControl,.sideActions{justify-self:auto}.sideActions{justify-content:center}.spinWrap{order:-1}.spinBtn{width:86px;height:86px}.pick{height:110px}}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand"><div class="logo">COLOR<span>X</span></div><div id="modePill" class="modePill demo">DEMO MODE</div></div>
    <div class="balanceCard"><small>BALANCE</small><div id="balanceBtn" class="balanceValue">0.00</div></div>
  </header>

  <main class="stage">
    <div class="hud">
      <div class="winBox"><small>LAST WIN</small><div id="winValue" class="winValue">0.00</div></div>
      <div class="fsBox"><small>FREE SPINS</small><div id="fsBtn">0</div></div>
    </div>
    <div class="slotShell"><div id="slot"></div></div>

    <div class="controls">
      <div class="betControl"><button id="betMinus" class="miniBtn">−</button><div class="betCenter"><small>BET</small><strong id="betScore">1.00</strong></div><button id="betPlus" class="miniBtn">+</button></div>
      <div class="spinWrap"><button id="spinBtn" class="spinBtn">SPIN</button></div>
      <div class="sideActions"><button id="autoBtn" class="actionBtn">AUTO OFF</button><button id="x2Btn" class="actionBtn x2" disabled>DOUBLE X2</button></div>
    </div>
    <div class="lower"><button id="soundBtn" class="iconBtn" title="Sound">🔊</button><button id="musicBtn" class="iconBtn" title="Music">🎵</button><button id="settingsBtn" class="iconBtn" title="Settings">⚙️</button></div>
    <div id="statusLine" class="statusLine">Ready to spin</div>
  </main>
</div>

<div id="settingsModal" class="modal"><div class="modalCard"><div class="modalTitle"><h2>Settings</h2><button id="closeSettings" class="close">✕</button></div><div class="settingRow"><span>Sound</span><input id="soundSlider" type="range" min="0" max="1" step="0.01" value="0.05"></div><div class="settingRow"><span>Music</span><input id="musicSlider" type="range" min="0" max="1" step="0.01" value="0.05"></div><div class="settingActions"><button id="demoBtn">REAL / DEMO</button><button id="promoBtn">PROMO</button></div></div></div>

<div id="x2Overlay" class="modal"><div class="modalCard x2Card"><div class="modalTitle"><h2>DOUBLE X2</h2><button id="closeX2" class="close">✕</button></div><div style="color:#8d95aa;font-weight:900">CURRENT PRIZE</div><div id="x2Balance" class="x2Amount">0.00</div><div class="pickRow"><button id="x2Left" class="pick">X</button><button id="x2Right" class="pick">0</button></div><button id="takeBtn" class="take">TAKE PRIZE</button></div></div>

<div id="celebration" class="celebration"><div class="celebrationInner"><div id="celebrationTitle" class="celebrationTitle">BIG WIN</div><div id="celebrationSub" class="celebrationSub"></div></div></div>
<div id="toast" class="toast"></div>
<audio id="bg" src="background.mp3" loop></audio>
<script>
let demo=localStorage.getItem('mode')==='real'?false:true;
let demoBalance=Number(localStorage.getItem('demoBalance')||1000000),realBalance=Number(localStorage.getItem('realBalance')||0);
let bet=1,auto=false,spinning=false,freeSpins=0,isFSSpin=false,soundVolume=.05,musicVolume=.05,audioUnlocked=false,lastWin=0,x2CurrentWin=0,x2Active=false,autoTimer=null;
const $=id=>document.getElementById(id),slot=$('slot'),bg=$('bg'),balanceBtn=$('balanceBtn'),betScore=$('betScore'),fsBtn=$('fsBtn'),autoBtn=$('autoBtn'),spinBtn=$('spinBtn'),winValue=$('winValue'),statusLine=$('statusLine'),modePill=$('modePill');
const symbols=['symbols/jack.gif','symbols/queen.gif','symbols/king.gif','symbols/spade.gif','symbols/ace.gif','symbols/bubnauses.gif','symbols/ten.gif','symbols/chirwa.gif','symbols/kresta.gif','symbols/BrandsymbolX.gif'];
const regularSymbols=symbols.filter(s=>!s.includes('BrandsymbolX.gif'));
const payouts={'jack.gif':[5,15,30,60],'queen.gif':[5,15,30,60],'king.gif':[8,20,40,80],'spade.gif':[2,5,10,20],'ace.gif':[10,25,50,100],'bubnauses.gif':[2,5,10,20],'ten.gif':[4,10,20,40],'chirwa.gif':[5,12,25,50],'kresta.gif':[5,12,25,50]};
const normalSounds={'ace.gif':'tuzovvrukave.mp3','bubnauses.gif':'bubey.mp3','chirwa.gif':'chirvaaa.mp3','jack.gif':'valatovmnevadnomesto.mp3','king.gif':'karalyuokpdepodast.mp3','kresta.gif':'krestamyzluh.mp3','queen.gif':'daminarukah.mp3','spade.gif':'pikaa.mp3','ten.gif':'desyatkaznakizdesyaty.mp3'};
const overlays=['symbols/Zarisovka1version.gif','symbols/zarisovka2version.gif'];
const fsSymbols=[1,2,5,10,15,20,25,50,75,100,150,200].map(v=>({img:`symbols/${v}.gif`,val:v}));
const fsSounds=['edynytsanebulytsa.mp3','dvoechkadurachka.mp3','pyatrazpoodnomu.mp3','desyatochkipregodyatsa.mp3','pyutnashkuvkarmashke.mp3','dvatsashkekbalashku.mp3','uhtudvadtsatpyat.mp3','klasspedesyuat.mp3','semdesyuatpyat.mp3','storazpoodnomu.mp3','stopedtesyatochki.mp3','dvuhsotenhvatyt.mp3'];
const getBalance=()=>demo?demoBalance:realBalance;function setBalance(v){if(demo)demoBalance=v;else realBalance=v;localStorage.setItem(demo?'demoBalance':'realBalance',String(v))}
function playSound(src){if(!src||soundVolume<=0)return;const a=new Audio(src);a.volume=soundVolume;a.play().catch(()=>{})}
function toast(t){const e=$('toast');e.textContent=t;e.classList.add('show');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('show'),1800)}
function createGrid(){slot.innerHTML='';for(let i=0;i<18;i++){const c=document.createElement('div');c.className='cell';const img=document.createElement('img');img.src=symbols[Math.random()*symbols.length|0];c.appendChild(img);slot.appendChild(c)}}
function clearEffects(){document.querySelectorAll('.overlay').forEach(o=>o.remove());document.querySelectorAll('.cell').forEach(c=>c.classList.remove('win','dim','landing'))}
function updateUI(){balanceBtn.textContent=getBalance().toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});betScore.textContent=bet.toFixed(2);fsBtn.textContent=freeSpins;autoBtn.textContent=auto?'AUTO ON':'AUTO OFF';autoBtn.classList.toggle('active',auto);modePill.textContent=demo?'DEMO MODE':'REAL MODE';modePill.classList.toggle('demo',demo);$('x2Btn').disabled=!x2Active;$('x2Balance').textContent=x2CurrentWin.toFixed(2)}
function enableX2(win){if(win<=0)return;lastWin=win;x2CurrentWin=win;x2Active=true;updateUI()}
function showCelebration(title,sub,ms=1600){$('celebrationTitle').textContent=title;$('celebrationSub').textContent=sub;$('celebration').classList.add('show');setTimeout(()=>$('celebration').classList.remove('show'),ms)}
function doSpin(){if(spinning)return;if(!audioUnlocked){audioUnlocked=true;bg.volume=musicVolume;bg.play().catch(()=>{})}isFSSpin=freeSpins>0;if(!isFSSpin&&getBalance()<bet){toast('Not enough balance');return}if(!isFSSpin)setBalance(getBalance()-bet);spinning=true;spinBtn.classList.add('spinning');statusLine.textContent=isFSSpin?'FREE SPIN...':'Spinning...';winValue.textContent='0.00';clearEffects();updateUI();const imgs=[...document.querySelectorAll('.cell img')],fsSound=isFSSpin?fsSounds[Math.random()*fsSounds.length|0]:null,chanceFS=.09;imgs.forEach((img,i)=>setTimeout(()=>{const cell=img.parentElement;cell.classList.remove('landing');void cell.offsetWidth;cell.classList.add('landing');if(isFSSpin){const f=fsSymbols[Math.random()*fsSymbols.length|0];img.src=f.img;img.dataset.val=f.val;img.classList.add('fs')}else if(Math.random()<chanceFS){img.src='symbols/BrandsymbolX.gif';img.dataset.val=0;img.classList.remove('fs');playSound('brandybolsx.mp3')}else{img.src=regularSymbols[Math.random()*regularSymbols.length|0];img.dataset.val=0;img.classList.remove('fs')}if(i===0&&fsSound)playSound(fsSound);if(i===imgs.length-1)setTimeout(finishSpin,120)},i*95))}
function finishSpin(){const imgs=[...document.querySelectorAll('.cell img')];let won=0;if(isFSSpin){freeSpins--;const sum=imgs.reduce((a,img)=>a+Number(img.dataset.val||0),0);won=sum/100;setBalance(getBalance()+won);winValue.textContent=won.toFixed(2);if(won>=bet*3)showCelebration('FREE WIN',`+${won.toFixed(2)}`,1100)}else{const counts={};imgs.forEach(img=>{const name=img.src.split('/').pop();if(payouts[name])counts[name]=(counts[name]||0)+1});let max=0,best=null;for(const s in counts)if(counts[s]>max){max=counts[s];best=s}if(max>=2){const idx=Math.min(max-2,payouts[best].length-1);won=bet*(payouts[best][idx]/100);setBalance(getBalance()+won);winValue.textContent=won.toFixed(2);playSound(normalSounds[best]);enableX2(won);imgs.forEach(img=>{const c=img.parentElement;if(img.src.includes(best)){c.classList.add('win');const o=document.createElement('img');o.src=overlays[Math.random()*overlays.length|0];o.className='overlay';c.appendChild(o)}else c.classList.add('dim')});if(won>=bet*2)showCelebration(won>=bet*5?'MEGA WIN':'BIG WIN',`+${won.toFixed(2)}`,1400)}const fsCount=imgs.filter(img=>img.src.includes('BrandsymbolX.gif')).length;if(fsCount>=5){freeSpins+=fsCount;showCelebration('FREE SPINS!',`${fsCount} spins activated`,1800);playSound('dershukafrispin.mp3')}}spinning=false;spinBtn.classList.remove('spinning');statusLine.textContent=won>0?`WIN +${won.toFixed(2)}`:(freeSpins>0?'Free spins ready':'No win');updateUI();if(auto||freeSpins>0){clearTimeout(autoTimer);autoTimer=setTimeout(()=>{if((auto||freeSpins>0)&&!spinning)doSpin()},650)}}
spinBtn.onclick=doSpin;$('betMinus').onclick=()=>{if(!spinning&&bet>1){bet--;updateUI()}};$('betPlus').onclick=()=>{if(!spinning){bet++;updateUI()}};autoBtn.onclick=()=>{auto=!auto;clearTimeout(autoTimer);updateUI();statusLine.textContent=auto?'Auto spin enabled':'Auto spin disabled';if(auto&&!spinning)doSpin()};
$('x2Btn').onclick=()=>{if(x2Active)$('x2Overlay').classList.add('open')};$('closeX2').onclick=()=>$('x2Overlay').classList.remove('open');$('takeBtn').onclick=()=>{if(!x2Active)return;const extra=Math.max(0,x2CurrentWin-lastWin);setBalance(getBalance()+extra);lastWin=x2CurrentWin;winValue.textContent=x2CurrentWin.toFixed(2);x2CurrentWin=0;x2Active=false;$('x2Overlay').classList.remove('open');updateUI();toast('Prize taken')};function x2Pick(){if(!x2Active)return;if(Math.random()<.5){x2CurrentWin*=2;playSound('x2onminigame.mp3');updateUI();showCelebration('X2 WIN!',x2CurrentWin.toFixed(2),900)}else{setBalance(Math.max(0,getBalance()-lastWin));x2CurrentWin=0;x2Active=false;playSound('x2offminigame.mp3');$('x2Overlay').classList.remove('open');updateUI();toast('X2 lost')}}$('x2Left').onclick=x2Pick;$('x2Right').onclick=x2Pick;
$('settingsBtn').onclick=()=>$('settingsModal').classList.add('open');$('closeSettings').onclick=()=>$('settingsModal').classList.remove('open');$('demoBtn').onclick=()=>{demo=!demo;localStorage.setItem('mode',demo?'demo':'real');updateUI();toast(demo?'DEMO mode':'REAL mode')};$('promoBtn').onclick=()=>{const v=Number(prompt('PROMO amount'));if(v>0){setBalance(getBalance()+v);updateUI();toast(`+${v.toFixed(2)}`)}};$('soundSlider').oninput=e=>soundVolume=+e.target.value;$('musicSlider').oninput=e=>{musicVolume=+e.target.value;bg.volume=musicVolume};$('soundBtn').onclick=()=>{soundVolume=soundVolume>0?0:.05;$('soundSlider').value=soundVolume;$('soundBtn').textContent=soundVolume?'🔊':'🔇'};$('musicBtn').onclick=()=>{musicVolume=musicVolume>0?0:.05;$('musicSlider').value=musicVolume;bg.volume=musicVolume;$('musicBtn').textContent=musicVolume?'🎵':'🔕'};document.querySelectorAll('.modal').forEach(m=>m.addEventListener('click',e=>{if(e.target===m)m.classList.remove('open')}));
createGrid();updateUI();
</script>
</body>
</html>
